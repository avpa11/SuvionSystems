name: Bug report
description: Report a reproducible problem in Suvion Systems.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include simulator scenario, operating system, Node version, and Docker or native setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials, vessel identifiers, and real coordinates before posting.
