services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - app_network

  signalk:
    image: ${SIGNALK_IMAGE:-cr.signalk.io/signalk/signalk-server:latest}
    container_name: signalk
    profiles:
      - signalk
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - signalk_data:/home/node/.signalk
    environment:
      - SIGNALK_DISABLE_SECURITY=true
    networks:
      - app_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "10110:10110/udp"
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/suvion
      - SIGNALK_ENABLED=${SIGNALK_ENABLED:-false}
      - SIGNALK_URL=${SIGNALK_URL:-ws://signalk:3000/signalk/v1/stream}
      - NMEA_PORT=10110
      - DEFAULT_FUEL_TYPE=diesel
      - VESSEL_ID=DEMO-VESSEL-001
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VALIDATION_AGENT_ENABLED=${VALIDATION_AGENT_ENABLED:-true}
      - REALTIME_AGENT_ENABLED=${REALTIME_AGENT_ENABLED:-true}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-}
      - OPENAI_REALTIME_VOICE=${OPENAI_REALTIME_VOICE:-}
      - OPENAI_REALTIME_CALLS_URL=${OPENAI_REALTIME_CALLS_URL:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENWEATHER_BASE_URL=${OPENWEATHER_BASE_URL:-}
      - ANOMALY_DETECTION_ENABLED=${ANOMALY_DETECTION_ENABLED:-false}
      - ANOMALY_LOOKBACK_MINUTES=${ANOMALY_LOOKBACK_MINUTES:-1440}
      - ANOMALY_INTERVAL_MS=${ANOMALY_INTERVAL_MS:-300000}
    depends_on:
      - mongo
    networks:
      - app_network

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:4001}
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-http://localhost:4001}
    depends_on:
      - api
    networks:
      - app_network

  # NMEA0183 mock feed. Runs inside app_network so UDP reaches the api
  # container directly (host->container UDP forwarding is unreliable on
  # Docker Desktop, which silently drops the sensor feed).
  simulator:
    image: python:3.12-slim
    container_name: simulator
    restart: unless-stopped
    working_dir: /sim
    volumes:
      - ./simulation:/sim:ro
    command: python nmea_generator.py --host api --port 10110 --scenario ${SIM_SCENARIO:-cruising}
    depends_on:
      - api
    networks:
      - app_network

volumes:
  mongo_data:
  signalk_data:

networks:
  app_network:
    external: true
