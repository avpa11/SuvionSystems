<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Suvion Systems architecture</title><desc id="desc">Python simulator and optional Signal K feed an Express API. The API computes emissions, stores readings in MongoDB, and serves live data and reports to a Next.js dashboard. External services are optional.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71dbc6"/></marker><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#edf4f7}.small{font-size:13px;fill:#a6b8c8}.box{fill:#142434;stroke:#355065;stroke-width:1.3}.line{fill:none;stroke:#71dbc6;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="430" rx="18" fill="#0b1420"/>
<text x="40" y="46" font-size="13" letter-spacing="3" fill="#71dbc6">SUVION SYSTEMS</text><text x="40" y="80" font-size="26">From vessel signals to useful insights</text>
<rect class="box" x="40" y="138" width="230" height="82" rx="10"/><text x="60" y="170" font-size="17">Python simulator</text><text class="small" x="60" y="195">Synthetic NMEA 0183 · UDP</text>
<rect class="box" x="40" y="254" width="230" height="82" rx="10"/><text x="60" y="286" font-size="17">Signal K · optional</text><text class="small" x="60" y="311">Own-vessel WebSocket deltas</text>
<rect class="box" x="363" y="138" width="240" height="198" rx="10"/><text x="385" y="177" font-size="20">Express API</text><text class="small" x="385" y="207">Parse + normalize readings</text><text class="small" x="385" y="233">Calculate fuel-derived CO₂</text><text class="small" x="385" y="259">Integrate recorded rates</text><text class="small" x="385" y="285">Report + retention services</text><text class="small" x="385" y="315">HTTP 4001 · UDP 10110</text>
<rect class="box" x="700" y="138" width="218" height="82" rx="10"/><text x="720" y="170" font-size="17">Next.js dashboard</text><text class="small" x="720" y="195">Live instruments · HTTP 4000</text>
<rect class="box" x="700" y="254" width="218" height="82" rx="10"/><text x="720" y="286" font-size="17">MongoDB 7</text><text class="small" x="720" y="311">Readings · 30-day retention</text>
<rect class="box" x="977" y="138" width="183" height="198" rx="10"/><text x="997" y="176" font-size="17">Reports</text><text class="small" x="997" y="207">JSON · CSV · PDF</text><text class="small" x="997" y="246">Observed coverage</text><text class="small" x="997" y="272">Hourly trends</text><text class="small" x="997" y="298">Demo targets</text>
<path class="line" d="M270 179H363"/><path class="line" d="M270 295H363"/><path class="line" d="M603 179H700"/><path class="line" d="M603 295H700"/><path class="line" d="M918 179H977"/>
<text class="small" x="40" y="389">LOCAL RESEARCH PROTOTYPE</text><text class="small" x="363" y="389">Optional: anomaly detection · weather · source evidence · AI assistant</text>
